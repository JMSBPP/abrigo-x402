[project]
name = "abrigo-x402-analysis"
version = "0.1.0"
description = "Abrigo x402 — L3+ panel + DGP analysis (Phase 2+)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "tick==0.8.0.2",
  "statsmodels==0.14.6",
  "polars==1.41.0",
  "numpy==2.4.6",
  "scipy==1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abrigo_x402"]
