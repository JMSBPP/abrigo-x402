# protocols/ichi.toml
#
# Iteration 1 swap surface: ICHI on cKES/USDT (single-vault microcosm).
#
# Q-4 granularity decision (per CONTEXT.md): primary panel is the cKES/USDT
# ANCHOR VAULT ONLY. No per-protocol aggregate is built in v1. Full ICHI
# Celo footprint is enumerated below with per-vault `active` boolean +
# `reason` fields to defend AF-12 silent re-scope; substrate expansion
# in future iterations is a toggle change, not a row addition (forbidden
# by schema-frozen check).
#
# address_resolution_status (per protocols/_schema.toml schema):
#   "verified" = address enumerated from Blockscout (CANDIDATES.md §3 + §5.5
#                primary-source LP-holder enumeration), ready for Phase 2+ fetch
#   "pending"  = zero-address placeholder, Phase 0 governance-only; Phase 2+
#                code MUST refuse to fetch against pending addresses (M12)

[protocol]
name = "ichi"
chain_id = 42220
factory_address = "0x9FAb4bdD4E05f5C023CCC85D2071b49791D7418F"
factory_blockscout_url = "https://celo.blockscout.com/address/0x9FAb4bdD4E05f5C023CCC85D2071b49791D7418F"
data_cost_class = "indexer-analytics-queries"
cost_leg_lower_bound_verified = false  # v1: cost leg is modeled, not paid (no Celo facilitator in x402-foundation monorepo as of 2026-05-25 per CLAUDE.md)
panel_construction = "single-vault"     # Q-4 per CONTEXT.md: single-vault microcosm only in v1
iteration = 1

# Cold-backfill anchor block for Plan 01-04 (Blockscout v1 getLogs bulk pull)
# and Plan 01-06 (--dry-run --estimate-budget over the (cold_backfill_from_block,
# forno_head) window). Initial placeholder is a conservative pre-deployment lower
# bound; Plan 01-04 may refine downward to the exact ICHI factory deployment block
# on Celo after paginated ICHIVaultCreated log retrieval. Value chosen as ~3 months
# before the 2026-05-26 Forno head snapshot (head=67,896,653, ~1s/block):
#   67,896,653 - (90 * 24 * 3600) = ~60,120,653 → rounded to 60,000,000
# Refinement triggers: any factory event observed before this block lowers the floor.
# Added at Plan 01-01 (I5 gate resolution); per-protocol-only field, not in
# protocols/_schema.toml — schema-frozen-check unaffected (verified live).
cold_backfill_from_block = 60000000

[protocol.anchor_pool]
# cKES/USDT Uniswap V3 anchor pool (Iter-1 headline)
address = "0x61Ef8708fc240DC7f9F2c0d81c3124Df2fd8829F"
token0 = "0x456a3D042C0DbD3db53D5489e98dFb038553B0d0"  # KESm (cKES) per CANDIDATES.md §1
token1 = "0x48065fbBE25f71C9282ddf5e1cD6D6A887483D5e"  # Canonical Celo USDT per CANDIDATES.md §1
fee_tier = 100  # 0.01% per CANDIDATES.md §2
mixing_class = "mento-native"
blockscout_url = "https://celo.blockscout.com/address/0x61Ef8708fc240DC7f9F2c0d81c3124Df2fd8829F"
swaps_per_30d_observed = 4440  # Per CANDIDATES §7.3 corrected count (post-block-time recalibration)
above_hawkes_floor = true       # 4440 / 300 = 14.8x above Hawkes floor

